<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotel Room Booking Form</title>
</head>
<body>
    <center>
        <h1>Hotel Room Booking Form</h1>
        <form action="" method="post">
            <label for="guest_name">Full Name:</label>
            <input type="text" id="guest_name" name="guest_name" required>
            <br><br>

            <label for="guest_email">Email:</label>
            <input type="email" id="guest_email" name="guest_email" required>
            <br><br>

            <label for="guest_phone">Phone:</label>
            <input type="tel" id="guest_phone" name="guest_phone" required>
            <br><br>

            <label for="arrival_date">Check-in Date:</label>
            <input type="date" id="arrival_date" name="arrival_date" required>
            <br><br>

            <label for="departure_date">Check-out Date:</label>
            <input type="date" id="departure_date" name="departure_date" required>
            <br><br>

            <label for="room_category">Room Type:</label>
            <select id="room_category" name="room_category">
                <option value="single">Single Room</option>
                <option value="double">Double Room</option>
                <option value="deluxe">Deluxe Room</option>
                <option value="suite">Suite</option>
            </select>
            <br><br>

            <label for="total_guests">Number of Guests:</label>
            <input type="number" id="total_guests" name="total_guests" min="1" max="10" style="width: 65px;" required>
            <br><br>
        </form>
    </center>
</body>
</html>
