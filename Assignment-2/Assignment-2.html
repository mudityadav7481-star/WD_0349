<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 2 - Formatting & Entities</title>
</head>
<body>
    <section>
        <!-- Headings Section -->
        <h1>Heading 1</h1>
        <h2>Heading 2</h2>
        <h3>Heading 3</h3>

        <!-- Formatting and Subscript/Superscript -->
        <p>Text with <b>bold</b>, <i>italic</i>, <u>underline</u>, <mark>mark</mark>, H<sub>2</sub>O, x<sup>2</sup></p>
        
        <!-- Special Character Entities -->
        <p>&copy; &reg; &trade; &lt;tag&gt; &amp; &euro; &#8377; &hearts;</p>
        
        <hr>
        
        <!-- Line Breaks and Paragraphs -->
        <p>
            Line one<br>
            Line two
        </p>
    </section>
</body>
</html>
