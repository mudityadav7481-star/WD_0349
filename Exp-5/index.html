<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
    <form action="submit.html" method="post">
        <div>
            <label for="stu_name">Full Name: </label>
            <input type="text" id="stu_name" name="stu_name" placeholder="Enter your full name" required>
        </div>
        <br>

        <div>
            <label for="stu_email">Email: </label>
            <input type="email" id="stu_email" name="stu_email" placeholder="Enter valid email address" required>
        </div>
        <br>

        <div>
            <label for="stu_pass">Password: </label>
            <input type="password" id="stu_pass" name="stu_pass" placeholder="Enter password" required>
        </div>
        <br>

        <div>
            <span>Gender: </span>
            <input type="radio" id="gen_m" name="stu_gender" value="Male" required>
            <label for="gen_m">Male</label>
            <input type="radio" id="gen_f" name="stu_gender" value="Female">
            <label for="gen_f">Female</label>
            <input type="radio" id="gen_o" name="stu_gender" value="Other">
            <label for="gen_o">Other</label>
        </div>
        <br>

        <div>
            <label for="stu_course">Course: </label>
            <select id="stu_course" name="stu_course" required>
                <option value="">-- Select Course --</option>
                <option value="btech">B.Tech</option>
                <option value="bca">BCA</option>
                <option value="mca">MCA</option>
                <option value="bsc">B.Sc</option>
            </select>
        </div>
        <br>

        <div>
            <label for="stu_contact">Contact No: </label>
            <input type="tel" id="stu_contact" name="stu_contact" placeholder="Enter phone number" required>
        </div>
        <br>
    </form>
</body>
</html>
