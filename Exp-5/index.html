<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
    <form action="submit.html" method="post">
        <div>
            <label for="stu_name">Full Name: </label>
            <input type="text" id="stu_name" name="stu_name" placeholder="Enter your full name" required>
        </div>
        <br>

        <div>
            <label for="stu_email">Email: </label>
            <input type="email" id="stu_email" name="stu_email" placeholder="Enter valid email address" required>
        </div>
        <br>

        <div>
            <label for="stu_pass">Password: </label>
            <input type="password" id="stu_pass" name="stu_pass" placeholder="Enter password" required>
        </div>
        <br>
    </form>
</body>
</html>
